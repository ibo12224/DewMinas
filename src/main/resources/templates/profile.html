<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="../static/css/profile.css" />
        <link rel="stylesheet" href="../static/css/styleguide.css" />
    </head>
    <body>
        <div class="main-bar"><img class="logo" src="../static/../static/img/logo.png"></img></div>
        <div class="frame">
            <div class="profile-picture"></div>
            <div class="view">
                <div class="head">
                    <div class="head-text">내프로필</div>
                </div>
                <div class="profile-frame">
                    <label class="profile-label">이름:</label>
                    <input class="profile-input" name="nameKor" disabled>
                </div>
                <div class="profile-frame">
                    <label class="profile-label">영어 이름:</label>
                    <input class="profile-input" name="nameEng" disabled>
                </div>
                <div class="profile-frame">
                    <label class="profile-label">닉네임:</label>
                    <input class="profile-input" name="nickname" disabled>
                </div>
                <div class="profile-frame">
                    <label class="profile-label">이메일:</label>
                    <input class="profile-input" name="email" disabled>
                </div>
                <div class="profile-frame">
                    <label class="profile-label">전화번호:</label>
                    <input class="profile-input" name="phoneNumber" disabled>
                </div>
            </div>
        </div>

        <div class="main-container">
            <div class="portfolio">
                <div class="head">
                    <div class="head-text">이력서</div>
                </div>
                <div class="portfolio-frame">
                    <a  class="plus-button" href="./resume-update.html" style="display: none;">
                        <img class="plus-image" src="../static/img/portfolio-plus.png" alt="Add Portfolio">
                    </a>
                    
                    <div class="portfolio-fame" id="portfolio-container"></div>
                </div>
            </div>
            
            <div class="portfolio">
                <div class="head"><div class="head-text">프로젝트</div></div>
                <div class="portfolio-frame"> 
                    <div class="portfolio-fame" >
                        <label class="portfolio-text-1" name="desiredPosition">Back-end developer</label>
                        <label class="portfolio-text-2" >1</label>
                        <label class="portfolio-text-2">1</label>
                        <button class="fix-button" id="p-fix-button">수정</button>
                        <button class="delete-button" id="p-delete-button">삭제</button>
                    </div>
                </div>                    
                <button class="project-plus-button" >
                    <div class="project-button">프로젝트 추가</div>
                </button>
            </div>
        </div>
    </body>
    <script src="/js/profile.js"></script>
</html>
