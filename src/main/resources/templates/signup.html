<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 가입</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">

    <style>
        .gradient-custom {
          background: linear-gradient(to right, rgba(254, 238, 229, 1), rgba(229, 193, 197, 1))
        }
    </style>
</head>
<body class="gradient-custom">
<section class="d-flex vh-100">
    <div class="container-fluid row justify-content-center align-content-center">
        <div class="card bg-dark" style="border-radius: 1rem;">
            <div class="card-body p-5 text-center">
                <h2 class="text-white">SIGN UP</h2>
                <p class="text-white-50 mt-2 mb-5">서비스 사용을 위한 회원 가입</p>

                <div class = "mb-2">
                    <form th:action="@{/user}" method="POST">
                        <!-- 토큰을 추가하여 CSRF 공격 방지 -->
                        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
                        <div class="mb-3">
                            <label class="form-label text-white">Email address</label>
                            <input id="emailInput" type="email" class="form-control" name="email">
                            <p></p>
                            <button id="dup-check-btn" type="button" class="btn btn-primary">check duplicates!</button>
                            <p id="dup-check-res" class="form-label" style="color: #FF0000;">중복 확인이 필요합니다.</p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">Password</label>
                            <input type="password" class="form-control" name="password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">핸드폰 번호</label>
                            <input type="text" class="form-control" name="phoneNumber">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">이름(한글)</label>
                            <input type="text" class="form-control" name="nameKor">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">이름(영어)</label>
                            <input type="text" class="form-control" name="nameEng">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">별명</label>
                            <input type="text" class="form-control" name="nickname">
                        </div>
                        <button id="submitBtn" type="submit" class="btn btn-primary" disabled="true">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        let emailInputBox = document.getElementById("emailInput");
let dupResultLabel = document.getElementById("dup-check-res");
let dupCheckMessage = ['중복 확인이 필요합니다.', '사용할 수 있는 이메일입니다.', '이미 가입된 이메일입니다.'];
let submitBtn = document.getElementById('submitBtn')

let dupCheckBtn = document.getElementById("dup-check-btn");

emailInputBox.addEventListener("click", (ev) => {
    dupResultLabel.textContent = dupCheckMessage[0];
    dupResultLabel.style.color = "#FF0000";
    submitBtn.disabled = true;
});

dupCheckBtn.addEventListener("click", (ev) => {
    ev.preventDefault();
    let targetEmail = emailInputBox.value;
    if(!targetEmail) {
        alert("이메일을 입력하세요.");
        return
    }
    fetch('/api/dupcheck', { method : 'POST', headers : { "Content-Type" : "application/json"}, body : JSON.stringify({ email : targetEmail})})
    .then((response) => response.json())
    .then((data) => {
        if(data.checkRes == 1) {
            dupResultLabel.textContent = dupCheckMessage[1];
            dupResultLabel.style.color = "#00FF00";
            submitBtn.disabled = false;
        } else {
            dupResultLabel.textContent = dupCheckMessage[2];
            dupResultLabel.style.color = "#FF0000";
            submitBtn.disabled = true;
        }
    }).catch(()=> { alert("에러가 발생했습니다."); });
});
    </script>
</section>
</body>
</html>
